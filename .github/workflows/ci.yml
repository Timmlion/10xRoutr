# .github/workflows/ci.yml

name: Run Python Tests

# Controls when the workflow will run
on:
  push:
    branches: [main] # Trigger the workflow on push events to the main branch
  pull_request:
    branches: [main] # Optionally, also run on pull requests targeting main

jobs:
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Specify the Python version(s) to test against
        # Using 3.11 based on pycache hints, adjust if needed
        python-version: ["3.11"]

    steps:
      # 1. Check out the repository code so the workflow can access it
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up the specified Python version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Cache dependencies to speed up subsequent runs
      # Caches pip downloads based on the requirements file hash
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip # The directory to cache
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      # 4. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Run tests using pytest
      # Assumes pytest will auto-discover tests in the 'tests' directory
      - name: Run tests
        run: |
          pytest
