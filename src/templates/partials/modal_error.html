{# Wyświetla błąd w strukturze modala #}
<div class="modal-header">
  <h5 class="modal-title text-danger">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error_title |
    default('Błąd') }}
  </h5>
  <button
    type="button"
    class="btn-close"
    data-bs-dismiss="modal"
    aria-label="Close"
  ></button>
</div>
<div class="modal-body">
  <p class="text-danger">
    {{ error_message | default('Wystąpił nieoczekiwany błąd.') }}
  </p>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
    Zamknij
  </button>
</div>
